name: "build-armv7"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or branch to build'
        required: true
        default: '2.3.9'
      timeout:
        description: 'Video parse timeout in seconds'
        required: true
        default: '45'

jobs:
  build-android-armv7:
    name: "Build armeabi-v7a APK"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Patch manifest for Android TV launcher
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#&\n    <uses-feature android:name="android.software.leanback" android:required="false"/>\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>#' $M
          sed -i 's#android:icon="@mipmap/ic_launcher"#&\n        android:banner="@mipmap/ic_launcher"#' $M
          sed -i 's#<category android:name="android.intent.category.LAUNCHER"/>#&\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>#' $M
          grep -q LEANBACK_LAUNCHER $M && grep -q 'android:banner' $M && grep -q 'android.software.leanback' $M
          head -45 $M
      - name: Increase video parse timeout
        run: |
          F=lib/services/video_source/webview_video_source_service.dart
          sed -i 's/Duration timeout = const Duration(seconds: 15)/Duration timeout = const Duration(seconds: ${{ inputs.timeout }})/' $F
          grep -n "Duration(seconds: ${{ inputs.timeout }})" $F
      - name: Install fixed signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > android/app/kazumi-tv.p12
          test -s android/app/kazumi-tv.p12
          G=android/app/build.gradle
          sed -i "s#^    buildTypes {#    signingConfigs {\n        kazumiTv {\n            storeFile file('kazumi-tv.p12')\n            storeType 'pkcs12'\n            storePassword 'android'\n            keyAlias 'androiddebugkey'\n            keyPassword 'android'\n        }\n    }\n\n&#" $G
          sed -i 's#signingConfig signingConfigs.debug#signingConfig signingConfigs.kazumiTv#' $G
          grep -n "kazumiTv" $G
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        id: flutter-action
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - name: Get Flutter dependencies
        run: flutter pub get
      - name: Remove build id
        run: sed -i -e 's/-Wl,/-Wl,--build-id=none,/' ${{ steps.flutter-action.outputs.PUB-CACHE-PATH }}/hosted/pub.dev/jni-*/src/CMakeLists.txt
      - name: Build armeabi-v7a APK
        run: flutter build apk --split-per-abi --target-platform android-arm
      - name: Verify signing certificate
        run: $(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner verify --print-certs build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk | tee /dev/stderr | grep -q "CN=Kazumi TV build"
      - name: Rename output
        run: cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk Kazumi_android_${{ inputs.ref }}_armeabi-v7a_tv.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kazumi_android_armeabi-v7a_tv
          path: Kazumi_android_*_armeabi-v7a_tv.apk
