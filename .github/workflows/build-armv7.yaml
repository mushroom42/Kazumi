name: "build-armv7"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or branch to build'
        required: true
        default: '2.3.9'

jobs:
  build-android-armv7:
    name: "Build armeabi-v7a APK"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Patch manifest for Android TV launcher
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#&\n    <uses-feature android:name="android.software.leanback" android:required="false"/>\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>#' $M
          sed -i 's#android:icon="@mipmap/ic_launcher"#&\n        android:banner="@mipmap/ic_launcher"#' $M
          sed -i 's#<category android:name="android.intent.category.LAUNCHER"/>#&\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>#' $M
          grep -q LEANBACK_LAUNCHER $M && grep -q 'android:banner' $M && grep -q 'android.software.leanback' $M
          head -45 $M
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        id: flutter-action
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - name: Get Flutter dependencies
        run: flutter pub get
      - name: Remove build id
        run: sed -i -e 's/-Wl,/-Wl,--build-id=none,/' ${{ steps.flutter-action.outputs.PUB-CACHE-PATH }}/hosted/pub.dev/jni-*/src/CMakeLists.txt
      - name: Build armeabi-v7a APK
        run: flutter build apk --split-per-abi --target-platform android-arm
      - name: Rename output
        run: cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk Kazumi_android_${{ inputs.ref }}_armeabi-v7a_tv.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kazumi_android_armeabi-v7a_tv
          path: Kazumi_android_*_armeabi-v7a_tv.apk
